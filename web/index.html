<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>TOiRE-76 UI skeleton</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="panel">
    <!-- z0 : static panel (plate, patches, slots, bezel, meter paper) -->
    <img id="panel-base" src="../renders/panel_base.png" alt="panel">
    <!-- z1 : printed scale layer, drawn from components.json -->
    <svg id="overlay" viewBox="0 0 950 175" width="950" height="175"></svg>
    <!-- z20: VU needle (clipped to the meter window) -->
    <div id="vu-window"></div>
    <!-- z30: meter glass reflection -->
    <img id="meter-glass" src="../renders/meter_glass.png" alt="glass">
    <!-- z40: moving parts -->
    <div id="knobs"></div>
    <div id="buttons"></div>
    <div id="hud"></div>
  </div>
</div>
<script src="vu-layout.js"></script>
<script src="app.js?v=1794277297"></script>
</body>
</html>
